<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- capture.cjs runs the slide figures' Chromium with FONTCONFIG_FILE=this file:
     the system config minus Unifont, a pixel font that otherwise draws 🌶
     (U+1F336) as jagged pixel art. 🌶 then comes from Noto Color Emoji, as in
     the stage browser (demo/browser/Dockerfile). -->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <selectfont><rejectfont><glob>/usr/share/fonts/opentype/unifont/*</glob></rejectfont></selectfont>
</fontconfig>
