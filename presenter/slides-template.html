<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Where Did This &lt;div&gt; Come From?</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; background: #16141f; color: #ece9f1; }
  /* The deck is sized from this one root — every size below is em-relative, so the
     slides scale with the viewport instead of clipping on a smaller projector.
     min(vh, vw) holds the 1920x1080 design proportional at any aspect ratio (28px at
     1080p, and it shrinks by width on a 4:3 beamer). No clamp() floor on purpose:
     a floor would bring the clipping back below it. */
  body {
    font-family: system-ui, sans-serif; font-size: min(2.593vh, 1.458vw);
    line-height: 1.45; overflow: hidden;
  }
  .slide {
    display: none; height: 100vh; padding: 8vh 10vw;
    flex-direction: column; justify-content: center; gap: 1.2em;
  }
  .slide.on { display: flex; }
  h1 { font-size: 2.6em; line-height: 1.15; }
  h2 { font-size: 1.9em; line-height: 1.2; }
  .sub { color: #9d94b8; font-size: .95em; }
  .accent { color: #8b7ff5; }
  .green { color: #34d399; }
  code, pre {
    font-family: ui-monospace, "JetBrains Mono", Menlo, monospace;
    background: #211d30; border-radius: .3em;
  }
  code { padding: .1em .35em; font-size: .92em; }
  pre { padding: .8em 1em; font-size: .8em; line-height: 1.5; overflow-x: auto; }
  /* box-drawing diagrams: rules must sit tight against their sides to read as a box */
  pre.diagram { line-height: 1.05; font-size: .78em; }
  /* ```diff fences: context recedes, additions get a band */
  pre .cx { display: block; color: #8d86a4; }
  pre .ad { display: block; color: #e8fff5; background: rgba(52, 211, 153, .12);
            box-shadow: -1em 0 0 rgba(52, 211, 153, .12), 1em 0 0 rgba(52, 211, 153, .12); }
  pre .rm { display: block; color: #f6d9d9; background: rgba(248, 113, 113, .12); }
  /* inline figures (```svg fences) */
  .figure { display: flex; justify-content: flex-start; }
  /* em, not rem: rem is the html root and would not follow the scaled body size */
  .figure svg { width: 100%; max-width: 36.6em; height: auto; }
  pre code { background: none; padding: 0; }
  pre .cm { color: #6f7890; font-style: italic; } pre .st { color: #7ec699; } pre .kw { color: #e0a06a; }
  pre .bi { color: #b7a5ff; } pre .mt { color: #e28ac0; } pre .at { color: #e0a06a; }
  ul { padding-left: 1.1em; display: grid; gap: .55em; }
  li::marker { color: #8b7ff5; }
  .big { font-size: 1.35em; }
  .rule { border-left: .21em solid #8b7ff5; padding: .4em 0 .4em .8em; }
  /* a remark on the block above — boxed, so it reads as an aside, not as body copy */
  .note { border-left: .18em solid #8b7ff5; background: rgba(139, 127, 245, .10);
          border-radius: 0 .3em .3em 0; padding: .5em .8em; color: #cdc5e4; font-size: .88em; }
  .num {
    position: fixed; right: 1.19em; bottom: .79em;
    font-size: .54em; color: #565070;
  }
  .steps { display: grid; grid-template-columns: 1fr 1fr; gap: .5em 2em; font-size: .85em; }
  .steps div { display: flex; gap: .6em; align-items: baseline; }
  .steps b { color: #8b7ff5; font-variant-numeric: tabular-nums; }
  table.void { border-collapse: collapse; font-size: .85em; }
  table.void th, table.void td { text-align: left; padding: .35em 1.2em .35em 0; }
  table.void th { color: #9d94b8; font-weight: 600; font-size: .85em; }
  table.void tr + tr { border-top: 1px solid #2c2740; }
  a { color: #8b7ff5; }
  .strike { text-decoration: line-through; opacity: .5; }
</style>
</head>
<body>

{{SLIDES}}

<div class="num" id="num"></div>
<script>
  // The current slide lives in the URL hash (#1, #2, …), so a reload keeps it.
  var slides = [].slice.call(document.querySelectorAll('.slide')), i = 0;
  function show(n) {
    i = Math.max(0, Math.min(slides.length - 1, n));
    slides.forEach(function (s, j) { s.classList.toggle('on', j === i); });
    document.getElementById('num').textContent = (i + 1) + ' / ' + slides.length;
    if (location.hash !== '#' + (i + 1)) history.replaceState(null, '', '#' + (i + 1));
  }
  function fromHash() { return (parseInt(location.hash.slice(1), 10) || 1) - 1; }
  window.addEventListener('hashchange', function () { show(fromHash()); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') show(i + 1);
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') show(i - 1);
    else if (e.key === 'Home') show(0);
  });
  document.addEventListener('click', function () { show(i + 1); });
  show(fromHash());
</script>
</body>
</html>
