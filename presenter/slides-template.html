<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Where Did This &lt;div&gt; Come From?</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; background: #16141f; color: #ece9f1; }
  /* The deck is sized from this one root — every size below is em-relative, so the
     slides scale with the viewport instead of clipping on a smaller projector.
     min(vh, vw) holds the 1920x1080 design proportional at any aspect ratio (36px at
     1080p, and it shrinks by width on a 4:3 beamer). No clamp() floor on purpose:
     a floor would bring the clipping back below it.
     Tuned for a 16:9 1080p projector: code lands at 30.6px = 23pt, well over the
     "font >= 20pt" rule in the run-sheet's stage setup, and the slides fill ~88%
     of the height and ~92% of the width.
     RAISING THIS IS NOT FREE, and the failure is silent: `pre` is a scroll
     container (overflow-x), so its automatic minimum size is 0 — inside this
     fixed-height flex column an oversized block is squashed and CLIPS its own
     last lines instead of overflowing the slide. Slide geometry still measures
     as "fits", so test by measuring scrollHeight-clientHeight on every <pre>,
     at 1920x1080, across all slides. At this padding/gap/leading, base 38 clips
     slide 7 (27px, the socket). The binding slides are the tall code blocks —
     7 (the socket), 15 (the loader) and 19 (a click that travels); the
     numbers move when slides are inserted, the names don't. */
  body {
    font-family: system-ui, sans-serif; font-size: min(3.333vh, 1.875vw);
    line-height: 1.45; overflow: hidden;
  }
  .slide {
    display: none; height: 100vh; padding: 4vh 4vw;
    /* the heading is pinned to the top-left corner; the body is centred in
       whatever height is left over (see the auto-margin rule below) */
    flex-direction: column; justify-content: flex-start; gap: .9em;
  }
  .slide.on { display: flex; }
  /* auto margins absorb free space in a flex column. One above the first body
     element and one below the last splits the leftover evenly, so the body
     block sits centred between the heading and the bottom edge — while the
     heading itself stays put at the top. */
  .slide > :first-child + * { margin-top: auto; }
  .slide > :last-child { margin-bottom: auto; }
  h1 { font-size: 2.6em; line-height: 1.15; }
  h2 { font-size: 1.9em; line-height: 1.2; }
  .sub { color: #9d94b8; font-size: .95em; }
  .accent { color: #8b7ff5; }
  .green { color: #34d399; }
  code, pre {
    font-family: ui-monospace, "JetBrains Mono", Menlo, monospace;
    background: #211d30; border-radius: .3em;
  }
  code { padding: .1em .35em; font-size: .92em; }
  /* 1.35 leading, not 1.5: on tall blocks that difference is what buys the
     larger base above without clipping slides 7, 15 and 19 (see above) */
  pre { padding: .5em 1em; font-size: .85em; line-height: 1.35; overflow-x: auto; }
  /* box-drawing diagrams: rules must sit tight against their sides to read as a box */
  pre.diagram { line-height: 1.05; font-size: .78em; }
  /* ```diff fences: context recedes, additions get a band */
  pre .cx { display: block; color: #8d86a4; }
  pre .ad { display: block; color: #e8fff5; background: rgba(52, 211, 153, .12);
            box-shadow: -1em 0 0 rgba(52, 211, 153, .12), 1em 0 0 rgba(52, 211, 153, .12); }
  pre .rm { display: block; color: #f6d9d9; background: rgba(248, 113, 113, .12); }
  /* inline figures (```svg fences) */
  .figure { display: flex; justify-content: flex-start; }
  /* em, not rem: rem is the html root and would not follow the scaled body size */
  .figure svg { width: 100%; max-width: 36.6em; height: auto; }
  /* ```diagram NAME K``` figures: the growing map. It takes all the room the heading
     leaves (1766x879 at 1080p, the canvas is 1760x870: 1 unit = 1 screen px), so
     every map slide lays out identically — a hard cut between two states then
     changes only the pixels of what was added. No transition, on purpose: the
     only motion is a state's `flow`s (diagram.js), and the opt-in {.pop}. */
  .figure.ax-fig { flex: 1 1 0; min-height: 0; justify-content: center; }
  .figure.ax-fig svg { max-width: none; width: 100%; height: 100%; }
  /* ```minimap NAME K ID,…``` insets: a you-are-here map of the current state, top
     right, .8em above the heading's top edge. Out of the flow, and the first child of
     the section, so the two rules below hand the auto margins on and the body stays
     exactly where it would be without it. build_slides.py writes each inset's width
     (--ax-mini-w, in em): as wide as the heading row allows without reaching down to
     the body (~9em beside an h1, ~7.6em beside an h2), at most --ax-mini-max, narrowed
     beside a long heading down to --ax-mini-min (below that the build warns). It reads
     those two numbers here, and assumes this sheet's padding, gap and h1/h2 sizes. */
  .slide { --ax-mini-max: 10; --ax-mini-min: 6.5; }
  .slide:has(> .ax-mini) { position: relative; }
  .slide > .ax-mini { position: absolute; top: calc(4vh - .8em); right: 4vw;
                      width: calc(var(--ax-mini-w, 9) * 1em); }
  .slide > .ax-mini:first-child + * { margin-top: 0; }
  .slide > .ax-mini:first-child + * + * { margin-top: auto; }
/*{{DIAGRAM_CSS}}*/
  /* font-size too: `code` above is .92em, which would compound with pre's own
     reduction and set block code smaller than intended (.8 x .92 = .736em) */
  pre code { background: none; padding: 0; font-size: inherit; }
  pre .cm { color: #6f7890; font-style: italic; } pre .st { color: #7ec699; } pre .kw { color: #e0a06a; }
  pre .bi { color: #b7a5ff; } pre .mt { color: #e28ac0; } pre .at { color: #e0a06a; }
  ul { padding-left: 1.1em; display: grid; gap: .55em; }
  li::marker { color: #8b7ff5; }
  .big { font-size: 1.35em; }
  .rule { border-left: .21em solid #8b7ff5; padding: .4em 0 .4em .8em; }
  /* a remark on the block above — boxed, so it reads as an aside, not as body copy */
  .note { border-left: .18em solid #8b7ff5; background: rgba(139, 127, 245, .10);
          border-radius: 0 .3em .3em 0; padding: .5em .8em; color: #cdc5e4; font-size: .88em; }
  .num {
    position: fixed; right: 1.19em; bottom: .79em;
    font-size: .54em; color: #565070;
  }
  .steps { display: grid; grid-template-columns: 1fr 1fr; gap: .5em 2em; font-size: .85em; }
  .steps div { display: flex; gap: .6em; align-items: baseline; }
  .steps b { color: #8b7ff5; font-variant-numeric: tabular-nums; }
  table.void { border-collapse: collapse; font-size: .85em; }
  table.void th, table.void td { text-align: left; padding: .35em 1.2em .35em 0; }
  table.void th { color: #9d94b8; font-weight: 600; font-size: .85em; }
  table.void tr + tr { border-top: 1px solid #2c2740; }
  a { color: #8b7ff5; }
  .strike { text-decoration: line-through; opacity: .5; }
</style>
</head>
<body>

{{SLIDES}}

<div class="num" id="num"></div>
<script>/*{{DIAGRAM_JS}}*/</script>
<script>
  // The current slide lives in the URL hash (#1, #2, …), so a reload keeps it.
  var slides = [].slice.call(document.querySelectorAll('.slide')), i = -1;   // -1: nothing shown yet
  function show(n) {
    var from = i;
    i = Math.max(0, Math.min(slides.length - 1, n));
    slides.forEach(function (s, j) { s.classList.toggle('on', j === i); });
    if (!(i !== n && i === from)) {                      // → on the last slide, ← on the first: stay put, don't restart
      slides[i].classList.toggle('fwd', from >= 0 && i === from + 1);   // {.pop} plays on forward moves only
      if (window.axFlows) axFlows.enter(slides[i], from > i);   // a map's flows reset on every arrival (back: its swaps seen)
    }
    document.getElementById('num').textContent = (i + 1) + ' / ' + slides.length;
    if (location.hash !== '#' + (i + 1)) history.replaceState(null, '', '#' + (i + 1));
  }
  function fromHash() { return (parseInt(location.hash.slice(1), 10) || 1) - 1; }
  window.addEventListener('hashchange', function () { show(fromHash()); });
  // Navigation only ever changes slides. A map's flows have their own two keys, a (play /
  // restart) and p (one step back), handled by diagram.js — so a click or → too many never
  // eats a flow, and a flow never eats a →. Ctrl/Cmd/Alt+a stay the browser's; a held key
  // does not repeat. A handled a / p is the page's alone (no type-to-find in the browser).
  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') show(i + 1);
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') show(i - 1);
    else if (e.key === 'Home') show(0);
    else if (window.axFlows && !e.ctrlKey && !e.metaKey && !e.altKey && !e.repeat) {
      var k = e.key.toLowerCase(), done = k === 'a' ? axFlows.play(slides[i]) : k === 'p' ? axFlows.back(slides[i]) : false;
      if (done) e.preventDefault();
    }
  });
  document.addEventListener('click', function () { show(i + 1); });
  show(fromHash());
</script>
</body>
</html>
